<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:">
<title>현황판</title>
<!-- 프리텐다드 1.3.9 (버전 고정, 화면에 쓰인 글자 묶음만 내려받는 웹폰트) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true">
  <filter id="warp" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.016" numOctaves="2" seed="3" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1.5" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="34" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- 말풍선 가장자리 빛 (다른 그릇의 g-edge와 같은 세기) -->
  <linearGradient id="bubEdgeGrad" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
    <stop offset=".35" stop-color="#fff" stop-opacity=".24"/>
    <stop offset=".65" stop-color="#fff" stop-opacity=".16"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".32"/>
  </linearGradient>
</svg>

<div id="pill" class="host pill">
  <div class="wpIn" aria-hidden="true"><div class="wp"></div></div>
  <div class="g-rim" aria-hidden="true"></div>
  <div class="g-glass" aria-hidden="true"></div>
  <div class="g-shine" aria-hidden="true"></div>
  <button id="pillBtn" class="pillBtn txt" type="button" aria-label="현황판 펼치기">
    <span class="breath" aria-hidden="true"></span>
    <span id="pillHead" class="pillHead" aria-hidden="true" hidden><span id="pillHeadBadge" class="pillBadge" hidden></span></span>
    <span class="pr1">
      <span id="pillDday" class="pd"></span>
      <span id="pillTitle" class="pt">불러오는 중</span>
      <span class="sep" aria-hidden="true"></span>
      <span id="pillCount" class="pc"></span>
    </span>
    <span id="pillProg" class="pr2" hidden>
      <span class="track"><span id="pillFill" class="fill"></span></span>
      <span id="pillPct" class="pct"></span>
    </span>
  </button>
  <button id="pillPin" class="pillPin" type="button" aria-label="맨 위 고정" aria-pressed="false" title="맨 위 고정 — 다른 창보다 늘 위"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3H7l3-3z"/><path d="M12 15v5"/></svg></button>
  <div class="g-edge" aria-hidden="true"></div>
</div>
<!-- 알약 위에 서 있는 클로드들 (켜진 세션 하나에 한 마리. 누르면 그 세션 열기) -->
<div id="crew" class="crew" role="group" aria-label="켜진 Claude 세션"></div>

<section id="panel" class="host panel" aria-label="작업 현황판">
  <div class="wpIn" aria-hidden="true"><div class="wp"></div></div>
  <div class="g-rim" aria-hidden="true"></div>
  <div class="g-glass" aria-hidden="true"></div>
  <div class="g-shine" aria-hidden="true"></div>
  <div class="content txt">
    <header class="head">
      <div class="ttl">
        <div class="ttlRow">
          <h1 title="빈 곳을 잡고 끌면 위젯을 옮겨요">현황판</h1>
          <button id="info" class="ib sm" type="button" aria-label="사용법" aria-expanded="false" title="사용법"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path d="M12 7.8v0.4"/></svg></button>
        </div>
        <p id="counts">불러오는 중</p>
      </div>
      <span id="dday" class="dday" hidden></span>
      <button id="clean" class="ib pop" type="button" aria-label="줄 그은 것 완료함으로 정리" title="줄 그은 것 완료함으로" hidden><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4l-8.5 8.5"/><path d="M11.5 12.5c-2.6-1.1-5.6.4-6.6 3.4L4 20l4-1c3-1 4.6-3.9 3.5-6.5z"/><path d="M7 16.5l1.5 1.5"/></svg><span id="cleanBadge" class="badge"></span></button>
      <button id="add" class="ib" type="button" aria-label="할 일 추가" aria-expanded="false" title="할 일 추가"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
      <button id="undo" class="ib is-off" type="button" aria-label="되돌리기" title="되돌리기"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6.5L4.5 11 9 15.5"/><path d="M5 11h9.5a5 5 0 0 1 0 10H12"/></svg></button>
      <button id="pinBtn" class="ib" type="button" aria-label="펼친 채로 고정" title="펼친 채로 고정"><svg class="i-pin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3H7l3-3z"/><path d="M12 15v5"/></svg><svg class="i-up" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14l5-5 5 5"/></svg></button>
    </header>

    <button id="prog" class="prog" type="button" title="프로젝트 탭에서 보기" hidden>
      <span class="progRow">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="5" rx="2.5"/><rect x="3" y="14" width="11" height="5" rx="2.5"/></svg>
        <span id="progName" class="progName trim"></span>
        <span id="progNow" class="progNow trim"></span>
        <span id="progPct" class="progPct trim"></span>
      </span>
      <span class="track"><span id="progFill" class="fill"></span></span>
    </button>

    <div id="tabs" class="tabs" role="tablist" hidden>
      <span class="thumb" aria-hidden="true"></span>
      <button id="tabTodo" class="tab is-on" type="button" role="tab" aria-selected="true" aria-controls="todoPane" title="할 일">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5l1.6 1.6L8.5 5"/><path d="M4 13.5l1.6 1.6L8.5 12"/><path d="M12 6.5h8"/><path d="M12 13.5h8"/><path d="M12 20h8"/></svg>
        <span class="nm trim">할 일</span><span id="tabTodoCount" class="cnt"></span>
      </button>
      <button id="tabProj" class="tab" type="button" role="tab" aria-selected="false" aria-controls="projPane" title="프로젝트">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="5" rx="2.5"/><rect x="3" y="14" width="11" height="5" rx="2.5"/></svg>
        <span class="nm trim">프로젝트</span><span id="tabProjCount" class="cnt"></span><span id="tabProjIc" class="tabIc" aria-hidden="true" hidden></span>
      </button>
    </div>

    <!-- 사용법: 왼쪽 = 누를 것(아이콘·짧은 말), 오른쪽 = 되는 일 -->
    <div id="infoPop" class="note info pop" role="note" hidden>
      <h3 class="infoH trim">할 일</h3>
      <dl class="infoList">
        <dt><span class="cbMini" aria-label="네모 칸"></span></dt><dd>줄 긋기</dd>
        <dt><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-label="빗자루"><path d="M20 4l-8.5 8.5"/><path d="M11.5 12.5c-2.6-1.1-5.6.4-6.6 3.4L4 20l4-1c3-1 4.6-3.9 3.5-6.5z"/><path d="M7 16.5l1.5 1.5"/></svg></dt><dd>줄 그은 것 → 완료</dd>
        <dt>끌기</dt><dd>순서 바꾸기 · 보류/완료로</dd>
        <dt>⋯</dt><dd>지금 할 것 · 보류 · 완료</dd>
      </dl>
      <h3 class="infoH trim">위젯</h3>
      <dl class="infoList">
        <dt>알약</dt><dd>올리면 잠깐 · 누르면 펼쳐 둠</dd>
        <dt><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="핀"><g transform="rotate(35 12 12)"><path d="M9 4h6l-1 5 3 3H7l3-3z"/><path d="M12 15v5"/></g></svg></dt><dd>다른 창보다 늘 위</dd>
        <dt>빈 곳</dt><dd>끌어서 옮기기</dd>
        <dt>아래 끝</dt><dd>끌어서 길이 조절</dd>
        <dt>클로드</dt><dd>누르면 그 세션 열기 · 땀 = 새 세션으로</dd>
      </dl>
      <h3 class="infoH trim">더</h3>
      <dl class="infoList">
        <dt><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="추가"><path d="M12 5v14"/><path d="M5 12h14"/></svg></dt><dd>날짜 넣으면 알림 · Claude가 물어봄</dd>
        <dt><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-label="톱니"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></dt><dd>색 · 유리/단색</dd>
        <dt>파일 이름</dt><dd>STATUS.md 열기</dd>
      </dl>
    </div>

    <div id="addBox" class="addBox pop" hidden>
      <div class="addRow">
        <input id="addInput" class="addInput" type="text" aria-label="새 할 일" placeholder="할 일 입력 후 Enter" autocomplete="off" spellcheck="false">
        <button id="addGo" class="ib" type="button" aria-label="추가" title="추가"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5v7a3 3 0 0 1-3 3H6"/><path d="M9.5 11.5L6 15l3.5 3.5"/></svg></button>
      </div>
      <div class="tagRow">
        <div id="tags" class="tags" role="radiogroup" aria-label="종류"></div>
        <button id="dateBtn" class="dateBtn" type="button" aria-label="날짜 고르기" aria-expanded="false" title="날짜">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16"/><path d="M8.5 3.5v4"/><path d="M15.5 3.5v4"/></svg>
          <span id="dateLabel" class="trim" hidden></span>
          <span id="dateX" class="dateX" role="button" aria-label="날짜 지우기" title="날짜 지우기" hidden><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></span>
        </button>
      </div>
      <div id="cal" class="cal" hidden>
        <div class="calHead">
          <span id="calMonth" class="calMonth trim"></span>
          <button id="calPrev" class="ib sm" type="button" aria-label="이전 달"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6.5L9 12l5.5 5.5"/></svg></button>
          <button id="calNext" class="ib sm" type="button" aria-label="다음 달"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5"/></svg></button>
        </div>
        <div id="calGrid" class="calGrid"></div>
      </div>
      <div id="kind" class="kindRow" hidden>
        <span class="kindSeg" role="radiogroup" aria-label="알림 방식">
          <button id="kindNotify" class="kd" type="button" role="radio" aria-checked="false" title="알림만 — 하루 전과 당일에 알림"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2H4.5z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="nm trim">알림만</span></button>
          <button id="kindAsk" class="kd is-on" type="button" role="radio" aria-checked="true" title="Claude가 물어보기 — 사흘 전부터"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a7.5 7.5 0 0 1-11 6.6L4.5 20l1.4-4A7.5 7.5 0 1 1 20 12z"/></svg><span class="nm trim">물어보기</span></button>
        </span>
      </div>
    </div>

    <div id="todoPane" class="pane" role="tabpanel">
    <div class="focusWrap">
      <h2 class="lbl">지금 할 것</h2>
      <div id="focus" class="list focus"></div>
      <h2 class="lbl next">다음</h2>
    </div>

    <div id="scroll" class="scroll">
      <div id="rest" class="list"></div>
      <div class="folds">
        <button id="holdFold" class="fold" type="button" data-zone="hold" aria-expanded="false" aria-controls="held">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6v12"/><path d="M15 6v12"/></svg>
          <span id="holdCount" class="grow">보류 0</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10l4 4 4-4"/></svg>
        </button>
        <div id="held" class="list pop" hidden></div>
        <button id="doneFold" class="fold" type="button" data-zone="done" aria-expanded="false" aria-controls="doneList">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.2l2.8 2.8 5.4-5.5"/></svg>
          <span id="doneCount" class="grow">완료 0</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10l4 4 4-4"/></svg>
        </button>
        <div id="doneList" class="list pop" hidden></div>
      </div>
    </div>
    </div>

    <div id="projPane" class="pane projPane" role="tabpanel" hidden></div>


    <footer class="foot">
      <button id="file" class="fileBtn" type="button" title="STATUS.md 열기"><span class="dot" aria-hidden="true"></span><span id="footText">STATUS.md</span></button>
      <span class="grow"></span>
      <button id="toneBtn" class="ib sm" type="button" aria-label="유리 색" aria-expanded="false" aria-controls="tonePop" title="유리 색"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </footer>
  </div>
  <div class="g-edge" aria-hidden="true"></div>
  <div id="tonePop" class="tonePop" hidden>
    <span class="kindSeg surfSeg" role="radiogroup" aria-label="질감">
      <button id="surfGlass" class="kd is-on" type="button" role="radio" aria-checked="true" data-surface="glass" title="유리 — 뒤가 비쳐요"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c3.2 3.6 6 7.1 6 10.4a6 6 0 0 1-12 0c0-3.3 2.8-6.8 6-10.4z"/><path d="M9.2 14.5a2.9 2.9 0 0 0 2.3 2.6"/></svg><span class="nm trim">유리</span></button>
      <button id="surfSolid" class="kd" type="button" role="radio" aria-checked="false" data-surface="solid" title="단색 — 비치지 않아요"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="4"/></svg><span class="nm trim">단색</span></button>
    </span>
    <div class="toneRow" role="radiogroup" aria-label="기본 색">
      <button class="sw sw-smoke" type="button" role="radio" aria-checked="true" data-tone="smoke" aria-label="스모크" title="스모크"></button>
      <button class="sw sw-milk" type="button" role="radio" aria-checked="false" data-tone="milk" aria-label="밀크" title="밀크"></button>
      <button class="sw sw-ice" type="button" role="radio" aria-checked="false" data-tone="ice" aria-label="아이스" title="아이스"></button>
      <button class="sw sw-lavender" type="button" role="radio" aria-checked="false" data-tone="lavender" aria-label="라벤더" title="라벤더"></button>
    </div>
    <!-- 내 색: 고를 때마다 하나씩 늘어난다 (커서를 올리면 ×로 지우기) -->
    <div id="myRow" class="toneRow myRow" role="radiogroup" aria-label="내 색">
      <button id="swAdd" class="sw sw-add" type="button" aria-label="색 추가" aria-expanded="false" title="색 추가"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
    </div>
    <div id="customRow" class="toneRow customRow" hidden>
      <input id="colorIn" class="colorIn" type="color" value="#7ab8e6" aria-label="팔레트에서 고르기" title="팔레트에서 고르기">
      <input id="hexIn" class="hexIn" type="text" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#7ab8e6" aria-label="색 코드">
      <button id="hexGo" class="ib sm" type="button" aria-label="이 색 추가" title="추가"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </div>
    <!-- 알약 클로드 자리 · 땀 나는 컨텍스트 양 -->
    <div class="toneRow optRow">
      <span id="crewIc" class="optIc" title="알약 클로드" aria-hidden="true"></span>
      <span class="kindSeg optSeg" role="radiogroup" aria-label="알약 클로드">
        <button class="kd" type="button" role="radio" aria-checked="false" data-crew="top" title="알약 위에 세션마다 한 마리씩"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="3.5"/><rect x="8" y="5" width="8" height="5" rx="1"/></svg><span class="nm trim">위</span></button>
        <button class="kd" type="button" role="radio" aria-checked="false" data-crew="dot" title="알약 점 자리에 제일 급한 한 마리"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="4"/><rect x="6" y="10.5" width="4" height="3" rx=".8" fill="currentColor"/></svg><span class="nm trim">점</span></button>
        <button class="kd" type="button" role="radio" aria-checked="false" data-crew="off" title="알약에는 안 보이기 (세션 탭에는 있어요)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="4"/></svg><span class="nm trim">끔</span></button>
      </span>
    </div>
    <div class="toneRow optRow">
      <span class="optIc" title="땀 나는 컨텍스트 양" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c3.2 3.6 6 7.1 6 10.4a6 6 0 0 1-12 0c0-3.3 2.8-6.8 6-10.4z"/></svg></span>
      <span class="kindSeg optSeg" role="radiogroup" aria-label="땀 나는 컨텍스트 양">
        <button class="kd" type="button" role="radio" aria-checked="false" data-sweat="200000" title="컨텍스트 20만이 넘으면 땀"><span class="nm trim">20만</span></button>
        <button class="kd" type="button" role="radio" aria-checked="false" data-sweat="300000" title="컨텍스트 30만이 넘으면 땀"><span class="nm trim">30만</span></button>
        <button class="kd" type="button" role="radio" aria-checked="false" data-sweat="500000" title="컨텍스트 50만이 넘으면 땀"><span class="nm trim">50만</span></button>
      </span>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="sizeGrip" class="sizeGrip" role="separator" aria-orientation="horizontal" aria-label="끌어서 높이 조절" title="끌어서 높이 조절"><span></span></div>
</section>

<!-- 접힌 알약 밑에 뜨는 날짜 알림: Claude가 묻는 것은 말풍선(꼬리는 화면 바깥쪽), 일정은 네모 칸 -->
<div id="ask" class="host notice bubble" role="dialog" aria-label="날짜 알림" hidden>
  <div class="wpClip" aria-hidden="true"><div class="wp"></div></div>
  <div class="g-rim" aria-hidden="true"></div>
  <div class="g-glass" aria-hidden="true"></div>
  <div class="g-shine" aria-hidden="true"></div>
  <svg id="askLine" class="bubLine" aria-hidden="true"><path id="askOut" class="bubOut"/><path id="askEdge" class="bubEdge"/></svg>
  <div id="askBody" class="noticeBody txt">
    <p id="askText" class="askText"></p>
    <div class="acts">
      <button id="askOpen" class="nb go" type="button" title="Claude 앱에 새 대화를 열고 질문을 넣어 둬요"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M18 14v3.5A2.5 2.5 0 0 1 15.5 20h-9A2.5 2.5 0 0 1 4 17.5v-9A2.5 2.5 0 0 1 6.5 6H10"/></svg><span class="trim">Claude에서 열기</span></button>
      <button id="askLater" class="nb" type="button" title="내일 다시 알려 줘요"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="trim">내일</span></button>
      <span class="grow"></span>
      <button id="askClose" class="ib" type="button" aria-label="닫기" title="닫기 (다시 묻지 않아요)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11"/><path d="M17.5 6.5l-11 11"/></svg></button>
    </div>
  </div>
</div>
<div id="sched" class="host notice box" role="status" hidden>
  <div class="wpIn" aria-hidden="true"><div class="wp"></div></div>
  <div class="g-rim" aria-hidden="true"></div>
  <div class="g-glass" aria-hidden="true"></div>
  <div class="g-shine" aria-hidden="true"></div>
  <div class="schedRow txt">
    <span class="bell" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2H4.5z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></span>
    <span class="schedTx"><span id="schedWhen" class="schedWhen"></span><span id="schedWhat" class="schedWhat"></span></span>
    <button id="schedOk" class="ib soft" type="button" aria-label="확인" title="확인"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button id="schedClose" class="ib" type="button" aria-label="닫기" title="닫기"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11"/><path d="M17.5 6.5l-11 11"/></svg></button>
  </div>
  <div class="g-edge" aria-hidden="true"></div>
</div>
<script src="clawd.js"></script>
<script src="widget.js"></script>
</body>
</html>
